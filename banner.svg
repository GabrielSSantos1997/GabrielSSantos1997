<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="1200" height="420" role="img" aria-labelledby="t d" xmlns:c2pa="http://c2pa.org/manifest">
  <title id="t">Gabriel Santos, desenvolvedor full stack</title>
  <desc id="d">Sistemas web feitos para o jeito que o seu negócio funciona. Porto Alegre, RS.</desc>
  <defs>
    <pattern id="grade" width="30" height="30" patternUnits="userSpaceOnUse">
      <rect x="14" y="14" width="2" height="2" fill="#3EE0D0" fill-opacity=".16"/>
    </pattern>
    <linearGradient id="fundo" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#071820"/>
      <stop offset="1" stop-color="#0A2530"/>
    </linearGradient>
    <radialGradient id="brilho" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#3EE0D0" stop-opacity=".22"/>
      <stop offset="1" stop-color="#3EE0D0" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="borda"><rect width="1200" height="420" rx="18"/></clipPath>
    <style>
      .trilha { fill: none; stroke: #3EE0D0; stroke-opacity: .32; stroke-width: 1.6; }
      .pulso  { fill: none; stroke: #3EE0D0; stroke-width: 2.4; stroke-linecap: round;
                stroke-dasharray: 26 520; animation: corre 3.6s linear infinite; }
      .p2 { animation-delay: -1.1s; animation-duration: 4.2s; }
      .p3 { animation-delay: -2.3s; animation-duration: 3.2s; }
      .p4 { animation-delay: -.6s;  animation-duration: 4.8s; }
      .p5 { animation-delay: -1.9s; animation-duration: 3.9s; }
      .p6 { animation-delay: -2.8s; animation-duration: 4.4s; }
      .areia { stroke: #F0C987; }
      @keyframes corre { from { stroke-dashoffset: 546; } to { stroke-dashoffset: 0; } }
      .contato { fill: #071820; stroke: #3EE0D0; stroke-width: 1.6; }
      .led { animation: pisca 2.4s ease-in-out infinite; }
      @keyframes pisca { 0%, 100% { opacity: 1; } 50% { opacity: .35; } }
      .nome   { font: 700 22px 'Segoe UI', 'Helvetica Neue', Arial, sans-serif; fill: #3EE0D0; }
      .titulo { font: 800 50px 'Segoe UI', 'Helvetica Neue', Arial, sans-serif; fill: #E6F1F2; letter-spacing: -1.4px; }
      .linha  { font: 400 21px 'Segoe UI', 'Helvetica Neue', Arial, sans-serif; fill: #8FA9AE; }
      .gs     { font: 800 64px 'Segoe UI', 'Helvetica Neue', Arial, sans-serif; fill: #3EE0D0; letter-spacing: -2px; }
      @media (prefers-reduced-motion: reduce) { .pulso, .led { animation: none; } }
    </style>
  </defs>

  <g clip-path="url(#borda)">
    <rect width="1200" height="420" fill="url(#fundo)"/>
    <rect width="1200" height="420" fill="url(#grade)"/>
    <circle cx="975" cy="210" r="240" fill="url(#brilho)"/>

    <!-- trilhas do chip até as bordas, sempre em ângulo reto -->
    <g>
      <path class="trilha" d="M885 165 H810 V75 H690"/>
      <path class="trilha" d="M885 210 H760 V255 H660"/>
      <path class="trilha" d="M885 255 H845 V385 H770"/>
      <path class="trilha" d="M945 120 V60 H1080 V0"/>
      <path class="trilha" d="M1005 120 V90 H1200"/>
      <path class="trilha" d="M1065 165 H1140 V240 H1200"/>
      <path class="trilha" d="M1065 255 H1110 V330 H1200"/>
      <path class="trilha" d="M975 300 V370 H870 V420"/>
      <path class="trilha" d="M1035 300 V390 H1200"/>

      <path class="pulso"     d="M885 165 H810 V75 H690"/>
      <path class="pulso p2"  d="M885 210 H760 V255 H660"/>
      <path class="pulso p3 areia" d="M885 255 H845 V385 H770"/>
      <path class="pulso p4"  d="M945 120 V60 H1080 V0"/>
      <path class="pulso p5"  d="M1065 165 H1140 V240 H1200"/>
      <path class="pulso p6"  d="M975 300 V370 H870 V420"/>
      <path class="pulso p2"  d="M1035 300 V390 H1200"/>

      <circle class="contato" cx="690" cy="75" r="5"/>
      <circle class="contato" cx="660" cy="255" r="5"/>
      <circle class="contato" cx="770" cy="385" r="5"/>
    </g>

    <!-- chip -->
    <g>
      <g stroke="#3EE0D0" stroke-opacity=".6" stroke-width="2">
        <path d="M873 150 h12 M873 172 h12 M873 194 h12 M873 216 h12 M873 238 h12 M873 260 h12"/>
        <path d="M1065 150 h12 M1065 172 h12 M1065 194 h12 M1065 216 h12 M1065 238 h12 M1065 260 h12"/>
      </g>
      <rect x="885" y="120" width="180" height="180" rx="20" fill="#0D2530" stroke="#3EE0D0" stroke-opacity=".7" stroke-width="1.6"/>
      <g stroke="#3EE0D0" stroke-width="2.4" fill="none">
        <path d="M870 128 V105 H893"/><path d="M1057 105 H1080 V128"/>
        <path d="M870 292 V315 H893"/><path d="M1057 315 H1080 V292"/>
      </g>
      <text class="gs" x="975" y="233" text-anchor="middle">GS</text>
      <circle class="led" cx="1043" cy="142" r="6" fill="#F0C987"/>
    </g>

    <!-- texto -->
    <text class="nome" x="72" y="118">Gabriel Santos · Desenvolvedor Full Stack</text>
    <text class="titulo" x="70" y="186">Sistemas web feitos</text>
    <text class="titulo" x="70" y="244">para o jeito que o seu</text>
    <text class="titulo" x="70" y="302">negócio funciona.</text>
    <text class="linha" x="72" y="352">PHP, MySQL, JavaScript, React, Python e Django · Porto Alegre, RS</text>
  </g>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
